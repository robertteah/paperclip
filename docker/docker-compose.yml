services:
  # --- PAPERCLIP SERVICES ---
  paperclip:
    build:
      context: .  # Lives directly inside the cloned Paperclip repo root
      dockerfile: Dockerfile
      args:
        # Passes host user permissions to the compiler to prevent volume locks
        - USER_UID=${USER_UID:-1000}
        - USER_GID=${USER_GID:-1000}
    container_name: paperclip-server
    restart: unless-stopped
    pids_limit: 2048  # Protects your VPS host from rogue agent process leaks
    ports:
      - "127.0.0.1:3100:3100"  # Kept secure behind localhost loopback
    environment:
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD}@paperclip-db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in your .env file}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      paperclip-db:
        condition: service_healthy

  paperclip-db:
    image: postgres:17-alpine
    container_name: paperclip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30

  # --- OPENCLAW SERVICES ---
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"  # Loopback security mapping
    environment:
      - NODE_ENV=production
      - OPENCLAW_ALLOWED_ORIGINS=*
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./openclaw-config:/home/node/.openclaw
      - ./openclaw-workspace:/home/node/openclaw/workspace
    depends_on:
      - paperclip

volumes:
  paperclip-data:
  pgdata:

