name: Build and Push Docker Images

on:
  push:
    branches: [ "productiony
" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Paperclip
        uses: docker/build-push-action@v5
        with:
          context: ./paperclip # Adjust path to Paperclip Dockerfile context
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/paperclip:latest

      - name: Build and push OpenClaw
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw # Adjust path to OpenClaw Dockerfile context
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openclaw:latest
